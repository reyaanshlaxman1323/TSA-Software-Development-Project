<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-In | SummitStudy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br>
    <nav class="navbar">
        <div class="logo">SummitStudy</div>
        <div class="navbar-right">
            <ul class="nav-links">
                <li><a href="IntroPage.html">Home</a></li>
                <li><a href="AboutWebPage.html">Features</a></li>
                <li><a href="AboutWebPage.html">About the Website</a></li>
            </ul>
            <a href="SignUpPage.html" class="nav-btn-signup">Log-In / Sign-Up</a>
        </div>
    </nav>
    <br>
    <main class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log-in to resume your ascent to success!</p>
            
            <form class="auth-form" id="loginForm">
                <div class="input-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="auth-btn">Resume Ascent</button>
            </form>
            
            <p class="auth-footer">Don't have an account? <a href="SignUpPage.html">Create one here</a></p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
